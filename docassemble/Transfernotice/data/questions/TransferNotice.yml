---
id: Transfer_to_Housing_Court
continue button field: TransferNotice_intro
question: |
  Transfer to the Housing Court
subquestion: |
  Use this interview to move an eviction case from District Court or Boston Municipal Court to Housing Court.
  You do not need a hearing to ask to move your case.
  File in both courts and give the other parties copies by the day before trial.
  If trial is today, ask the clerk or a lawyer about your options right away.

  Housing Court judges specialize in housing law. Some Housing Courts offer programs such as
  [Lawyer for the Day](https://www.mass.gov/service-details/lawyer-for-the-day-programs)
  and the [Tenancy Preservation Program](https://www.mass.gov/info-details/tenancy-preservation-program).

  Have your Summons and Complaint ready. Copy the names exactly as they appear there.
  Read [Massachusetts Legal Help’s transfer guide](https://www.masslegalhelp.org/housing-apartments-shelter/eviction/how-transfer-your-case-housing-court) for the filing steps.
---
id: check transfer eligibility
question: |
  Is this a pending eviction case you can move to Housing Court?
subquestion: |
  Use this form if all of these statements are true:

  * Your eviction case was filed in District Court or Boston Municipal Court.
  * Your trial has not started and no judgment has been entered.
fields:
  - Do all of these statements apply to you?: eligible_for_transfer
    datatype: yesnoradio
---
id: transfer not supported
event: transfer_not_supported
question: |
  This interview may not fit your case
subquestion: |
  Read [Massachusetts Legal Help’s transfer guide](https://www.masslegalhelp.org/housing-apartments-shelter/eviction/how-transfer-your-case-housing-court)
  or ask a lawyer about your options. If you selected the wrong answer, go back to change it.
buttons:
  - Exit: exit
---
id: transfer docket number
question: |
  What is your case’s docket number?
subquestion: |
  Look near the top right of your Summons and Complaint. If you do not know the number,
  ask the court clerk. You can also add it to the printed notice.
fields:
  - Docket number: docket_number
    required: False
---
generic object: ALIndividual
code: |
  x.name.first
  x.has_transfer_attorney
  if x.has_transfer_attorney:
    x.transfer_attorney.name.first
    x.transfer_attorney.address.address
    x.transfer_attorney.phone_number
  else:
    x.address.address
    x.phone_number
  x.plaintiffs_gather_complete = True
---
generic object: ALIndividual
code: |
  x.name.first
  x.address.address
  x.email
  x.defendants_gather_complete = True
---
id: landlord has attorney
question: |
  Does ${ plaintiffs[i] } have a lawyer in this case?
fields:
  - no label: plaintiffs[i].has_transfer_attorney
    datatype: yesnoradio

---
id: transfer attorney name
question: |
  What is ${ plaintiffs[i] }’s lawyer’s name?
fields:
  - code: |
      plaintiffs[i].transfer_attorney.name_fields()
---
id: transfer attorney address
question: |
  What is ${ plaintiffs[i].transfer_attorney }’s mailing address?
fields:
  - code: |
      plaintiffs[i].transfer_attorney.address_fields()
---
id: transfer attorney phone
question: |
  What is ${ plaintiffs[i].transfer_attorney }’s phone number?
fields:
  - Phone number: plaintiffs[i].transfer_attorney.phone_number
    datatype: al_phone
    required: False
---
id: transfer landlord phone
question: |
  What is ${ plaintiffs[i] }’s phone number?
fields:
  - Phone number: plaintiffs[i].phone_number
    datatype: al_phone
    required: False
---
id: court information
question: |
  Which courts will get the notice?
subquestion: |
  Copy your current court’s name from the Summons and Complaint.
  Check [Housing Court locations](https://www.mass.gov/orgs/housing-court/locations) for the court that serves your city or town.

  [FILE court_and_county.png, 100%, Court name and county in the upper-right corner of the Summons and Complaint]
fields:
  - note: |
      We have tried to fill in the name of your current court based on your address.
  - Court where your case was filed: court
    datatype: object
    default: local_court
    choices: all_courts.filter_courts(allowed_courts)
  - note: |
      Check the [Housing Court locations](https://www.mass.gov/orgs/housing-court/locations) website to learn where the Housing Court sits for your city or town.
      
      We have tried to fill in the name of the Housing Court that serves your address.
  - Housing Court for your city or town: transfer_court
    datatype: object
    default: local_housing_court
    choices: all_courts.filter_courts(['Housing Court'])
--- 
code: |
  if defendants[0].address.city == "Boston": 
    local_court = all_courts.matching_bmc(defendants[0].address)
  else: 
    local_court = all_courts.matching_district_court(defendants[0].address)
---
code: |
  local_housing_court = all_courts.matching_housing_court(defendants[0].address)
---
id: TransferNotice review screen
event: review_TransferNotice
question: |
  Review your answers
review:
  - Edit: defendants.revisit
    button: |
      **Tenant(s)**

      % for item in defendants:
        * ${ item }
      % endfor
  - Edit: plaintiffs.revisit
    button: |
      **Landlord(s)**

      % for item in plaintiffs:
        * ${ item }
      % endfor
  - note: |
      % for landlord in plaintiffs:
      **Copy for ${ landlord }**: ${ landlord.transfer_attorney if landlord.has_transfer_attorney else landlord }
      % endfor
  - Edit: docket_number
    button: |
      **Docket number**: ${ docket_number or "Not entered" }
  - Edit: court
    button: |
      **Original court**: ${ court }
  - Edit: transfer_court
    button: |
      **Housing Court**: ${ transfer_court }
---
continue button field: plaintiffs.revisit
id: "edit landlords"
question: |
  Edit Landlords
subquestion: |
  ${ plaintiffs.table }

  % for landlord in plaintiffs:
  <%
  recipient = landlord.transfer_attorney if landlord.has_transfer_attorney else landlord
  %>
  **${ recipient.name }**
  ${ recipient.address.on_one_line() }
  ${ recipient.phone_number or "" }

  ${ action_button_html(url_ask([recipient.instanceName + ".name.first", recipient.instanceName + ".address.address", recipient.instanceName + ".phone_number"]), label="Edit contact for " + str(recipient.name), color="link") }
  % endfor

  ${ plaintiffs.add_action() }
---
table: plaintiffs.table
rows: plaintiffs
columns:
  - Landlord: row_item.name.full()
  - "Who gets a copy": |
      row_item.transfer_attorney if row_item.has_transfer_attorney else row_item
edit:
  - name.first
  - has_transfer_attorney
confirm: True
---
continue button field: defendants.revisit
id: "edit tenants"
question: |
  Edit Tenants
subquestion: |
  ${ defendants.table }

  ${ defendants.add_action() }
---
table: defendants.table
rows: defendants
columns:
  - Name: |
      row_item.name.full() if defined("row_item.name.first") else ""
  - Address: |
      row_item.address.block() if defined("row_item.address.address") else ""
edit:
  - name.first
  - address.address
  - phone_number
  - email
confirm: True
---
id: download TransferNotice
event: TransferNotice_download
question: |
  Your form is ready to download.
subquestion: |
  Review the notice. Then print it, sign and date it, and follow the separate filing instructions.
  Click "Make changes" to fix any mistakes.

  ${ action_button_html(url_action('review_TransferNotice'), label='Make changes', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }

progress: 100
